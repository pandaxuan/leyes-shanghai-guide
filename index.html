<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Pinko Lab</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

    <style>

        body { margin: 0; background: #000205; color: white; overflow: hidden; font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", sans-serif; -webkit-tap-highlight-color: transparent; }

        #canvas-container { position: fixed; inset: 0; z-index: 0; }

        #fixed-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; pointer-events: none; }

        #main-ui { position: relative; z-index: 10; height: 100vh; display: flex; align-items: center; justify-content: center; pointer-events: none; }

        #chat-history { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 22px 12px; pointer-events: auto; mask-image: linear-gradient(to bottom, transparent, black 8%, black 94%, transparent); -webkit-mask-image: linear-gradient(to bottom, transparent, black 8%, black 94%, transparent); scroll-behavior: smooth; }

        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 0 50px rgba(0, 0, 0, 0.6); pointer-events: auto; }

        @keyframes rotate-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .music-spinning { animation: rotate-slow 4s linear infinite; }

        @keyframes ethereal-fade { from { opacity: 0; filter: blur(12px); transform: translateY(15px) scale(1.05); } to { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); } }

        .ethereal-text { animation: ethereal-fade 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .center-tracking { padding-left: 0.8em; }

        @media (max-width: 640px) {

            .mobile-title { font-size: 2.2rem !important; letter-spacing: 0.6em !important; padding-left: 0.6em !important; }

            .mobile-subtitle { font-size: 9px !important; letter-spacing: 0.3em !important; white-space: nowrap; }

            .mobile-text { font-size: 1rem !important; font-weight: 300 !important; color: rgba(255,255,255,0.9) !important; }

        }

        @keyframes lavaMove { 0% { transform: translate(-20%, -20%) scale(1); } 100% { transform: translate(20%, 20%) scale(1.2); } }

        @keyframes sparkle { 0% { opacity: 0.1; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        .lava-container { mask-image: radial-gradient(circle at center, black 30%, transparent 100%); filter: contrast(150%) brightness(120%); }
        /* 图片呼吸感动画 */
.oracle-image-load {
    animation: image-bloom 4s ease-out forwards;
}

@keyframes image-bloom {
    from { filter: blur(20px) brightness(0); transform: scale(1.1); }
    to { filter: blur(0) brightness(1); transform: scale(1); }
}

        .music-entry { position: relative; pointer-events: auto; }
        .music-popover { position: absolute; top: calc(100% + 14px); right: 0; width: 238px; padding: 18px; border: 1px solid rgba(186,230,253,.22); border-radius: 18px; background: rgba(4,8,18,.78); box-shadow: 0 20px 70px rgba(0,0,0,.65); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); animation: music-rise .5s ease-out forwards; }
        .music-popover[hidden], .music-modal[hidden] { display: none; }
        .music-kicker, .music-now-label, .music-room-kicker { display: block; color: rgba(186,230,253,.5); font-size: 9px; letter-spacing: .38em; }
        .music-popover strong { display: block; margin: 8px 0 4px; color: rgba(255,255,255,.9); font-size: 15px; font-weight: 300; letter-spacing: .08em; }
        .music-popover > span:nth-of-type(2) { display: block; color: rgba(255,255,255,.42); font-size: 10px; letter-spacing: .12em; }
        .music-enter { display: flex; justify-content: space-between; width: 100%; margin-top: 16px; padding: 11px 0 2px; border: 0; border-top: 1px solid rgba(255,255,255,.1); background: transparent; color: rgba(186,230,253,.85); font-size: 11px; letter-spacing: .14em; cursor: pointer; }
        .music-modal { position: fixed; inset: 0; z-index: 120; display: flex; align-items: center; justify-content: center; padding: 28px; background: rgba(0,2,5,.82); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
        .music-room { position: relative; width: min(100%, 620px); max-height: calc(100vh - 56px); overflow-y: auto; padding: 42px 42px 34px; border: 1px solid rgba(255,255,255,.13); border-radius: 28px; background: rgba(5,10,22,.76); box-shadow: 0 30px 100px rgba(0,0,0,.7); text-align: center; }
        .music-close { position: absolute; top: 18px; right: 22px; border: 0; background: transparent; color: rgba(255,255,255,.5); font-size: 28px; font-weight: 200; cursor: pointer; }
        .music-visual { position: relative; display: grid; place-items: center; width: 154px; height: 154px; margin: 34px auto 28px; border: 1px solid rgba(186,230,253,.42); border-radius: 50%; color: rgba(186,230,253,.86); box-shadow: 0 0 0 14px rgba(186,230,253,.035), 0 0 70px rgba(99,102,241,.18); }
        .music-visual::before, .music-visual::after { position: absolute; inset: 17px; border: 1px solid rgba(255,255,255,.13); border-radius: 50%; content: ''; animation: music-orbit 5s linear infinite; }
        .music-visual::after { inset: -10px; border-color: rgba(186,230,253,.18); animation-direction: reverse; animation-duration: 8s; }
        .music-visual i { width: 34px; height: 34px; stroke-width: 1; }
        .music-room h2 { margin: 12px 0 8px; color: rgba(255,255,255,.9); font-size: 26px; font-weight: 300; letter-spacing: .12em; }
        .music-artist { margin-bottom: 26px; color: rgba(255,255,255,.45); font-size: 11px; letter-spacing: .18em; }
        .music-progress { height: 2px; overflow: hidden; background: rgba(255,255,255,.13); cursor: pointer; }
        .music-progress span { display: block; width: 0; height: 100%; background: rgba(186,230,253,.85); transition: width .2s linear; }
        .music-time, .music-playlist-head { display: flex; justify-content: space-between; color: rgba(255,255,255,.35); font-size: 10px; letter-spacing: .1em; }
        .music-time { margin-top: 8px; }
        .music-controls { display: flex; align-items: center; justify-content: center; gap: 28px; margin: 24px 0 30px; }
        .music-controls button { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid rgba(255,255,255,.15); border-radius: 50%; background: rgba(255,255,255,.035); color: rgba(255,255,255,.72); font-size: 16px; cursor: pointer; }
        .music-controls .play-control { width: 58px; height: 58px; border-color: rgba(186,230,253,.55); background: rgba(186,230,253,.82); color: #041018; font-size: 18px; }
        .music-playlist-head { padding: 14px 0 10px; border-top: 1px solid rgba(255,255,255,.1); color: rgba(255,255,255,.5); }
        .music-list { display: grid; gap: 5px; text-align: left; }
        .music-list-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 11px 8px; border: 1px solid transparent; border-radius: 12px; background: transparent; color: rgba(255,255,255,.65); text-align: left; cursor: pointer; }
        .music-list-item:hover, .music-list-item.active { border-color: rgba(186,230,253,.18); background: rgba(186,230,253,.06); }
        .music-list-number, .music-list-state { color: rgba(186,230,253,.55); font-size: 10px; letter-spacing: .08em; }
        .music-list-item strong, .music-list-item small { display: block; }
        .music-list-item strong { font-size: 12px; font-weight: 300; letter-spacing: .08em; }
        .music-list-item small { margin-top: 4px; color: rgba(255,255,255,.35); font-size: 10px; }
        @keyframes music-rise { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes music-orbit { to { transform: rotate(360deg); } }
        @media (max-width: 640px) { .music-popover { position: fixed; top: 78px; right: 16px; left: 16px; width: auto; } .music-modal { align-items: flex-end; padding: 0; } .music-room { width: 100%; max-height: 92vh; padding: 34px 24px 26px; border-radius: 26px 26px 0 0; } .music-visual { width: 130px; height: 130px; margin-top: 28px; } }
        .chat-widget { position: fixed; right: 28px; bottom: 28px; z-index: 80; pointer-events: auto; }
        .chat-toggle { display: grid; place-items: center; width: 64px; height: 64px; border: 1px solid rgba(186,230,253,.28); border-radius: 50%; background: rgba(4,8,18,.64); color: rgba(255,255,255,.76); box-shadow: 0 18px 70px rgba(0,0,0,.72), 0 0 42px rgba(186,230,253,.08); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); cursor: pointer; transition: transform .5s ease, border-color .5s ease, background .5s ease; }
        .chat-toggle:hover { transform: translateY(-2px); border-color: rgba(186,230,253,.52); background: rgba(8,16,32,.76); color: white; }
        .chat-toggle i { width: 25px; height: 25px; stroke-width: 1.3; }
        .chat-panel { position: absolute; right: 0; bottom: 82px; display: flex; flex-direction: column; width: min(420px, calc(100vw - 32px)); height: min(620px, calc(100vh - 132px)); overflow: hidden; border: 1px solid rgba(255,255,255,.12); border-radius: 24px; background: rgba(2,7,17,.72); box-shadow: 0 30px 110px rgba(0,0,0,.78); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); transform-origin: bottom right; animation: chat-open .45s ease-out forwards; }
        .chat-panel[hidden] { display: none; }
        .chat-panel-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 14px 22px; border-bottom: 1px solid rgba(255,255,255,.08); }
        .chat-panel-head span { color: rgba(186,230,253,.58); font-size: 10px; letter-spacing: .34em; text-transform: uppercase; }
        .chat-close { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.1); border-radius: 50%; background: rgba(255,255,255,.025); color: rgba(255,255,255,.56); cursor: pointer; }
        .chat-input-shell { margin: 0 14px 14px; display: flex; gap: 8px; align-items: center; padding: 10px 10px 10px 16px; border: 1px solid rgba(255,255,255,.1); border-radius: 999px; background: rgba(255,255,255,.035); }
        .chat-input-shell input { min-width: 0; }
        @keyframes chat-open { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @media (max-width: 640px) { .chat-widget { right: 16px; bottom: 16px; } .chat-panel { bottom: 76px; height: min(560px, calc(100vh - 108px)); border-radius: 22px; } .chat-toggle { width: 58px; height: 58px; } }

    </style>

</head>

<body>

    <div id="canvas-container"></div>

    <audio id="bgm" src="bgm.mp3"></audio>

    <div id="fixed-nav">

        <nav class="p-6 sm:p-10 flex justify-between items-center pointer-events-auto">

            <h1 class="text-lg sm:text-xl font-thin tracking-[0.4em] text-white/70 uppercase italic">Pinko Lab</h1>

            <div class="flex items-center gap-3 sm:gap-6">

                <div id="music-entry" class="music-entry">
                <button id="music-btn" aria-expanded="false" class="glass-card flex items-center gap-2 text-white/60 px-4 py-2.5 rounded-full border border-white/5 transition-all">

                    <div id="music-icon-container"><i data-lucide="music" class="w-3 h-3 sm:w-4 sm:h-4"></i></div>

                    <span class="text-[9px] sm:text-[10px] tracking-[0.3em] uppercase">星河音乐</span>

                </button>

                <div id="music-popover" class="music-popover" hidden>
                    <span class="music-kicker">正在播放</span>
                    <strong id="popoverTrackTitle">星河的回声</strong>
                    <span id="popoverTrackMood">深夜 · 漂浮</span>
                    <button id="openMusicRoom" class="music-enter">进入音河 <span>↗</span></button>
                </div>
                </div>

            </div>

        </nav>

    </div>

    <div id="main-ui">

        <div id="header-section" class="text-center px-6 ethereal-text">

                <h2 class="text-3xl sm:text-5xl font-thin tracking-[0.8em] sm:tracking-[1.2em] mb-8 text-white/80 mobile-title center-tracking">星河</h2>

                <div class="flex justify-center items-center gap-3 px-4">

                    <div class="h-[1px] flex-grow max-w-[40px] bg-white/10"></div>

                    <p class="text-white/40 tracking-[0.4em] text-[10px] sm:text-xs uppercase mobile-subtitle">Pinko 的 AI 创造实验室</p>

                    <div class="h-[1px] flex-grow max-w-[40px] bg-white/10"></div>

                </div>

            </div>

        </div>

    <div id="chat-widget" class="chat-widget">
        <section id="chat-panel" class="chat-panel" hidden aria-label="星河对话">
            <div class="chat-panel-head">
                <span>星河对话</span>
                <button id="chat-close" class="chat-close" aria-label="收起对话">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="chat-history" class="no-scrollbar">
                <div id="message-container" class="space-y-8 pb-8"></div>
            </div>
            <div class="chat-input-shell">
                <input type="text" id="user-input" class="flex-grow bg-transparent text-white px-2 py-2 outline-none placeholder:text-white/20 text-sm tracking-[0.12em] font-light" placeholder="把未说完的话，写给星河...">
                <button id="send-btn" class="text-white/45 hover:text-white transition-all duration-700 p-1" aria-label="发送">
                    <i data-lucide="arrow-up-circle" class="w-8 h-8 stroke-[1px]"></i>
                </button>
            </div>
        </section>
        <button id="chat-toggle" class="chat-toggle" aria-label="展开对话" aria-expanded="false">
            <i data-lucide="message-circle"></i>
        </button>
    </div>

    <div id="music-modal" class="music-modal" hidden aria-label="音河播放器">
        <div class="music-room">
            <button id="closeMusicRoom" class="music-close" aria-label="关闭音河">×</button>
            <div class="music-room-kicker">Pinko Lab · 音河</div>
            <div class="music-visual" aria-hidden="true"><span></span><i data-lucide="music-2"></i></div>
            <p class="music-now-label">NOW PLAYING</p>
            <h2 id="musicRoomTitle">星河的回声</h2>
            <p id="musicRoomArtist" class="music-artist">Pinko Lab · 深夜 · 漂浮</p>
            <div class="music-progress"><span id="musicProgressBar"></span></div>
            <div class="music-time"><span id="musicCurrentTime">0:00</span><span id="musicDuration">0:00</span></div>
            <div class="music-controls">
                <button id="previousTrack" aria-label="上一首">⟲</button>
                <button id="playMusic" class="play-control" aria-label="播放">▶</button>
                <button id="nextTrack" aria-label="下一首">⟳</button>
            </div>
            <div class="music-playlist-head"><span>播放列表</span><span id="musicTrackCount">1 首</span></div>
            <div id="musicList" class="music-list"></div>
        </div>
    </div>

    <script>

        const BACKEND_URL = 'https://leyes-shanghai-guide.onrender.com';

        const bgm = document.getElementById('bgm');

        const musicBtn = document.getElementById('music-btn');

        const musicIconContainer = document.getElementById('music-icon-container');
        const musicEntry = document.getElementById('music-entry');
        const musicPopover = document.getElementById('music-popover');
        const musicModal = document.getElementById('music-modal');
        const musicProgressBar = document.getElementById('musicProgressBar');
        const playMusicButton = document.getElementById('playMusic');
        const musicLibrary = [
            { title: 'Gentle', artist: 'Pinko He', mood: '温柔 · 漂浮', src: 'music/Gentle.mp3' },
            { title: 'Banana', artist: 'Pinko He', mood: '随性 · 地下', src: 'music/Banana.mp3' },
            { title: 'Shibuya', artist: 'Pinko He', mood: '阴暗 · 潮湿', src: 'music/Shibuya.mp3' },
            { title: 'Velvet Static', artist: 'Pinko He', mood: '丝绒 · 暗紫', src: 'music/VelvetStatic.mp3' },
            // 上传到 GitHub 时，把更多音频文件放进 music/ 文件夹，
            // 然后复制下面这一行，改 title / artist / mood / src 即可。
            // 支持 mp3、m4a、aac、wav；最推荐 mp3，兼容性最好、文件也更适合网页。
            // { title: '夜航', artist: 'Pinko Lab', mood: '安静 · 漫游', src: 'music/night.mp3' },
            // { title: '记忆潮汐', artist: 'Pinko Lab', mood: '柔软 · 回声', src: 'music/tide.mp3' },
        ];
        let currentTrackIndex = 0;
        let popoverTimer;
        let isPlaying = false;

        let chatContext = []; 

        // let idleTimer = null; 

        // let autoMessageCount = 0;

        let hasName = false;

        let userName = "";

        // const MAX_AUTO_MESSAGES = 10;

        // const IDLE_TIME = 60000;

        function formatMusicTime(seconds) {
            if (!Number.isFinite(seconds)) return '0:00';
            return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
        }

        function renderMusicList() {
            musicList.innerHTML = musicLibrary.map((track, index) => `
                <button class="music-list-item ${index === currentTrackIndex ? 'active' : ''}" data-track-index="${index}">
                    <span class="music-list-number">${String(index + 1).padStart(2, '0')}</span>
                    <span><strong>${track.title}</strong><small>${track.artist} · ${track.mood}</small></span>
                    <span class="music-list-state">${index === currentTrackIndex ? '正在播放' : '播放'}</span>
                </button>
            `).join('');
            document.getElementById('musicTrackCount').textContent = `${musicLibrary.length} 首`;
        }

        function loadTrack(index, autoplay = false) {
            currentTrackIndex = (index + musicLibrary.length) % musicLibrary.length;
            const track = musicLibrary[currentTrackIndex];
            bgm.src = track.src;
            bgm.load();
            document.getElementById('popoverTrackTitle').textContent = track.title;
            document.getElementById('popoverTrackMood').textContent = track.mood;
            document.getElementById('musicRoomTitle').textContent = track.title;
            document.getElementById('musicRoomArtist').textContent = `${track.artist} · ${track.mood}`;
            renderMusicList();
            if (autoplay) playCurrentTrack();
        }

        function playCurrentTrack() {
            bgm.play().then(() => {
                isPlaying = true;
                musicIconContainer.classList.add('music-spinning');
                musicBtn.style.opacity = "1";
                musicBtn.setAttribute('aria-pressed', 'true');
                playMusicButton.textContent = 'Ⅱ';
            }).catch(() => {});
        }

        function toggleMusic() {
            if (bgm.paused) playCurrentTrack();
            else {
                bgm.pause();
                isPlaying = false;
                musicIconContainer.classList.remove('music-spinning');
                musicBtn.style.opacity = "0.4";
                musicBtn.setAttribute('aria-pressed', 'false');
                playMusicButton.textContent = '▶';
            }
        }

        function toggleMusicPopover() {
            clearTimeout(popoverTimer);
            const isOpen = !musicPopover.hidden;
            musicPopover.hidden = isOpen;
            musicBtn.setAttribute('aria-expanded', String(!isOpen));
        }

        function openMusicRoom() {
            musicModal.hidden = false;
            musicPopover.hidden = true;
            musicBtn.setAttribute('aria-expanded', 'false');
            renderMusicList();
        }

        function closeMusicRoom() { musicModal.hidden = true; }

        musicEntry.addEventListener('mouseenter', () => {
            clearTimeout(popoverTimer);
            musicPopover.hidden = false;
            musicBtn.setAttribute('aria-expanded', 'true');
        });
        musicEntry.addEventListener('mouseleave', () => {
            popoverTimer = setTimeout(() => {
                musicPopover.hidden = true;
                musicBtn.setAttribute('aria-expanded', 'false');
            }, 220);
        });
        musicBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleMusic();
            clearTimeout(popoverTimer);
            musicPopover.hidden = false;
            musicBtn.setAttribute('aria-expanded', 'true');
        });
        document.getElementById('openMusicRoom').addEventListener('click', openMusicRoom);
        document.getElementById('closeMusicRoom').addEventListener('click', closeMusicRoom);
        playMusicButton.addEventListener('click', toggleMusic);
        document.getElementById('previousTrack').addEventListener('click', () => loadTrack(currentTrackIndex - 1, true));
        document.getElementById('nextTrack').addEventListener('click', () => loadTrack(currentTrackIndex + 1, true));
        musicList.addEventListener('click', (event) => {
            const item = event.target.closest('[data-track-index]');
            if (item) loadTrack(Number(item.dataset.trackIndex), true);
        });
        bgm.addEventListener('timeupdate', () => {
            const progress = bgm.duration ? (bgm.currentTime / bgm.duration) * 100 : 0;
            musicProgressBar.style.width = `${progress}%`;
            document.getElementById('musicCurrentTime').textContent = formatMusicTime(bgm.currentTime);
            document.getElementById('musicDuration').textContent = formatMusicTime(bgm.duration);
        });
        bgm.addEventListener('ended', () => loadTrack(currentTrackIndex + 1, true));
        document.querySelector('.music-progress').addEventListener('click', (event) => {
            if (!bgm.duration) return;
            const rect = event.currentTarget.getBoundingClientRect();
            bgm.currentTime = ((event.clientX - rect.left) / rect.width) * bgm.duration;
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeMusicRoom();
        });
        loadTrack(0);

        function resetIdleTimer() {

            if (idleTimer) clearTimeout(idleTimer);

            if (!hasName || autoMessageCount >= MAX_AUTO_MESSAGES) return;

            idleTimer = setTimeout(() => {

                const topics = ["感叹当下的寂静与星光", "探讨旅人沉默背后的思绪", "引用一段关于宇宙、时间或孤独的空灵哲思", "询问旅人此刻是否在听那远古的星声", "观察星云的流动，并分享一种转瞬即逝的美感", "探讨记忆与光年的关系", "温柔地提醒旅人，无论多久，星河都会在此守候"];

                const randomTopic = topics[Math.floor(Math.random() * topics.length)];

                const idlePrompt = `旅人已沉思许久。请作为星河守护者，基于“${randomTopic}”这个主题主动发起一段对话。要求：语言极度优美、空灵，不要重复之前说过的话，字数控制在30字左右。`;

                autoMessageCount++;

                sendToAI(idlePrompt, true);

            }, IDLE_TIME);

        }

        async function handleStream(res, element) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    const history = document.getElementById('chat-history');
    let fullContent = ""; 
    element.innerText = "";

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        const lines = chunk.split('\n');

        for (const line of lines) {
            if (line.startsWith('data: ')) {
                try {
                    const jsonStr = line.substring(6).trim();
                    if (!jsonStr) continue;
                    const data = JSON.parse(jsonStr);
                    
                    if (data.text) {
                        fullContent += data.text;
                        element.innerText = fullContent;
                        history.scrollTo({ top: history.scrollHeight, behavior: 'auto' });
                    }
                } catch (e) {
                    console.error("解析流数据出错", e);
                }
            }
        }
    }
    return fullContent;
}

        async function sendToAI(userMessage, isAuto = false) {

            const container = document.getElementById('message-container');

            const history = document.getElementById('chat-history');

            const uniqueId = 'ai-' + Date.now();

            container.insertAdjacentHTML('beforeend', `<div class="mb-10 ethereal-text"><div class="text-white/20 text-[10px] tracking-[0.4em] uppercase mb-2 center-tracking">星响</div><div id="${uniqueId}" class="text-white/60 font-thin text-base tracking-[0.1em] italic mobile-text">聆听群星...</div></div>`);

            const aiDisplay = document.getElementById(uniqueId);

            history.scrollTo({ top: history.scrollHeight, behavior: 'smooth' });

            try {
            // --- 优化后的名字识别逻辑 ---
            if (!hasName) {
                // 检查上下文，看看上一个 AI 的话是不是在问名字
                const lastAIResponse = chatContext.findLast(m => m.role === "assistant")?.content || "";
                
                // 只要上个回复包含“名字”二字，且当前不是自动触发的消息
                if ((lastAIResponse.includes("名字") || lastAIResponse.includes("谁在发光")) && !isAuto) {
                    userName = userMessage.replace(/我叫|我是|叫我|名字是|。/g, "").trim();
                    hasName = true;
                    
                }
            }

                let processedMessage = userMessage;

                let systemPrompt = "你是一个空灵的星河守护者。Pinko Lab 是你的名字。";

                if (hasName) {

                    processedMessage = `${userMessage} （注意：我是${userName}，请在回复的开头或结尾自然地称呼旅人的名字）`;

                    systemPrompt += `当前旅人名字叫“${userName}”。你必须在每一句回复中都包含这个名字。`;

                }

                const res = await fetch(`${BACKEND_URL}/api/chat`, {

                    method: 'POST',

                    headers: { 'Content-Type': 'application/json' },

                    body: JSON.stringify({ message: processedMessage, messages: [{ role: "system", content: systemPrompt }, ...chatContext, { role: "user", content: processedMessage }], language: 'zh' }),

                });

                const finalResponse = await handleStream(res, aiDisplay);

                aiDisplay.classList.remove('italic');

                chatContext.push({role: "user", content: userMessage});

                chatContext.push({role: "assistant", content: finalResponse});

                if (chatContext.length > 20) chatContext = chatContext.slice(-20);

                // resetIdleTimer();

            } catch (e) { aiDisplay.innerText = "信号在光年外迷失了..."; }

        }

        const handleSend = async () => {
    const input = document.getElementById('user-input');
    const message = input.value.trim();
    if (!message) return;

    // if (idleTimer) clearTimeout(idleTimer);

    const container = document.getElementById('message-container');
    container.insertAdjacentHTML('beforeend', `<div class="mb-10"><div class="text-white/20 text-[10px] tracking-[0.4em] uppercase mb-2 center-tracking">叩问</div><div class="text-white/80 font-thin text-base tracking-[0.1em] mobile-text">${message}</div></div>`);
    
    input.value = "";
    
    await sendToAI(message);
};

        const chatPanel = document.getElementById('chat-panel');
        const chatToggle = document.getElementById('chat-toggle');
        const chatClose = document.getElementById('chat-close');

        function openChatPanel() {
            chatPanel.hidden = false;
            chatToggle.setAttribute('aria-expanded', 'true');
            chatToggle.setAttribute('aria-label', '收起对话');
            setTimeout(() => document.getElementById('user-input').focus(), 80);
        }

        function closeChatPanel() {
            chatPanel.hidden = true;
            chatToggle.setAttribute('aria-expanded', 'false');
            chatToggle.setAttribute('aria-label', '展开对话');
        }

        chatToggle.addEventListener('click', () => {
            if (chatPanel.hidden) openChatPanel();
            else closeChatPanel();
        });

        chatClose.addEventListener('click', closeChatPanel);

        // document.getElementById('user-input').addEventListener('input', () => { if (idleTimer) clearTimeout(idleTimer); });

        document.getElementById('send-btn').onclick = () => {
            openChatPanel();
            handleSend();
        };

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                openChatPanel();
                handleSend();
            }
        });

        let scene, camera, renderer, particles, mouse = new THREE.Vector2(), targetMouse = new THREE.Vector2();

        const PARTICLE_COUNT = window.innerWidth < 640 ? 4500 : 12000;

        function createGlowTexture() {

            const canvas = document.createElement('canvas');

            canvas.width = 64; canvas.height = 64;

            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);

            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');

            gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.7)');

            gradient.addColorStop(0.6, 'rgba(255, 255, 255, 0.2)');

            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 64, 64);

            return new THREE.CanvasTexture(canvas);

        }

        function initThree() {

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            camera.position.z = 7;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

            renderer.setSize(window.innerWidth, window.innerHeight);

            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();

            const pos = new Float32Array(PARTICLE_COUNT * 3);

            const colors = new Float32Array(PARTICLE_COUNT * 3);

            const originalColors = new Float32Array(PARTICLE_COUNT * 3);

            const palette = [new THREE.Color('#ffffff'), new THREE.Color('#ffffff'), new THREE.Color('#bae6fd'), new THREE.Color('#e9d5ff')];

            for (let i = 0; i < PARTICLE_COUNT; i++) {

                pos[i*3] = (Math.random() - 0.5) * 20; pos[i*3+1] = (Math.random() - 0.5) * 20; pos[i*3+2] = (Math.random() - 0.5) * 10;

                const col = palette[Math.floor(Math.random() * palette.length)];

                colors[i*3] = originalColors[i*3] = col.r; colors[i*3+1] = originalColors[i*3+1] = col.g; colors[i*3+2] = originalColors[i*3+2] = col.b;

            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            geo.setAttribute('originalColor', new THREE.BufferAttribute(originalColors, 3));

            const mat = new THREE.PointsMaterial({ size: window.innerWidth < 640 ? 0.08 : 0.035, map: createGlowTexture(), vertexColors: true, transparent: true, opacity: window.innerWidth < 640 ? 0.7 : 0.5, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });

            particles = new THREE.Points(geo, mat);

            scene.add(particles);

            const handleMove = (x, y) => { targetMouse.x = (x / window.innerWidth) * 2 - 1; targetMouse.y = -(y / window.innerHeight) * 2 + 1; };

            window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));

            window.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });

        }

        function animate() {

            requestAnimationFrame(animate);

            mouse.lerp(targetMouse, 0.02);

            const positions = particles.geometry.attributes.position.array;

            const colors = particles.geometry.attributes.color.array;

            const originals = particles.geometry.attributes.originalColor.array;

            const time = Date.now() * 0.0003;

            for (let i = 0; i < PARTICLE_COUNT; i++) {

                const i3 = i * 3;

                positions[i3] += Math.sin(time + i) * 0.0004; positions[i3+1] += Math.cos(time + i) * 0.0004;

                const flicker = 0.8 + Math.sin(time * 5 + i) * 0.2;

                colors[i3] = originals[i3] * flicker; colors[i3+1] = originals[i3+1] * flicker; colors[i3+2] = originals[i3+2] * flicker;

                const dx = positions[i3] - (mouse.x * 6); const dy = positions[i3+1] - (mouse.y * 4);

                const distSq = dx*dx + dy*dy;

                if (distSq < 3) { const dist = Math.sqrt(distSq); const force = (1.5 - dist) / 1.5; positions[i3] += dx * force * 0.01; positions[i3+1] += dy * force * 0.01; }

            }

            particles.geometry.attributes.position.needsUpdate = true;

            particles.geometry.attributes.color.needsUpdate = true;

            particles.rotation.y += 0.0002;

            renderer.render(scene, camera);

        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        initThree(); 

        animate(); 

        lucide.createIcons();

    </script>
